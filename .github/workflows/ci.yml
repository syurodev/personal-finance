name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Vitest runs under Node; Bun installs dependencies and runs the app.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        # setup-bun reads the exact packageManager version from package.json.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Postgres with test roles
        run: bash .github/scripts/start-test-db.sh

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:int
      - run: bun run test:e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: personal-finance-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production migrations and HTTP startup
        run: bash .github/scripts/smoke-image.sh "personal-finance-ci:$GITHUB_SHA"

      - name: PostgreSQL diagnostics
        if: failure()
        run: docker logs pf-db || true

      - name: Clean up test database
        if: always()
        run: docker rm -f -v pf-db || true

  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/syurodev/personal-finance:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  update-workload:
    name: Update workload image tag (Argo CD deploys)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require workload repository token
        env:
          WORKLOAD_REPO_TOKEN: ${{ secrets.WORKLOAD_REPO_TOKEN }}
        run: |
          if [ -z "$WORKLOAD_REPO_TOKEN" ]; then
            echo '::error::Set WORKLOAD_REPO_TOKEN with contents:write on syurodev/workload.'
            exit 1
          fi

      - name: Check out workload repository
        uses: actions/checkout@v4
        with:
          repository: syurodev/workload
          ref: main
          token: ${{ secrets.WORKLOAD_REPO_TOKEN }}

      - name: Install Kustomize from official release
        run: |
          set -euo pipefail
          version=v5.8.1
          archive="kustomize_${version}_linux_amd64.tar.gz"
          release="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/$version"
          tool_dir="$RUNNER_TEMP/kustomize"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/$archive" -o "$tool_dir/$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/checksums.txt" -o "$tool_dir/checksums.txt"
          (cd "$tool_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" kustomize
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/kustomize" version

      - name: Pin and push image tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # A rerun of an old revision must not roll back a newer release.
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo 'Source main has moved; skipping this obsolete image bump.'
              exit 0
            fi
            # This is a disposable checkout of the workload repository only.
            # Reapply the single-file change if another project pushed first.
            git fetch origin main
            git reset --hard origin/main
            (
              cd personal-finance/dev/server
              kustomize edit set image \
                "ghcr.io/syurodev/personal-finance=ghcr.io/syurodev/personal-finance:sha-$GITHUB_SHA"
            )
            kustomize build personal-finance/dev/server > /dev/null
            git add personal-finance/dev/server/kustomization.yaml
            if git diff --cached --quiet; then
              echo 'Image is already pinned.'
              exit 0
            fi
            git commit -m "chore(personal-finance): deploy sha-${GITHUB_SHA::7}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Workload push failed (attempt $attempt/3); refreshing before retry."
          done
          echo '::error::Could not update the workload repository after 3 attempts.'
          exit 1
